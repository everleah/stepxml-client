[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepxmlclient"
version = "1.0.0"
description = "Python client for Stibo Systems STEP XML and REST API v2"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "everleah", email = "everleah@hansch.info"}]
maintainers = [{name = "everleah", email = "everleah@hansch.info"}]
keywords = ["stibo", "step", "mdm", "xml", "rest", "pim"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["requests-openapi", "requests", "pydantic>=2.0"]

[project.urls]
Source = "https://git.claudiapps.de/Hoerl-IM/StepXML-Client"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["stepxmlclient*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.json", "*.xsd"]
